<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 314" role="img" aria-labelledby="title description">
  <title id="title">Two ways to study emergence</title>
  <desc id="description">Multiscale asks which coarse-grained variables emerge from high-dimensional dynamics. Synergy asks what information wholes carry that their parts alone do not.</desc>
  <rect width="1000" height="314" rx="20" fill="#05090b"/>
  <rect x="1" y="1" width="998" height="312" rx="19" fill="none" stroke="#1b343b" stroke-width="2"/>

  <text x="42" y="50" fill="#92aeb5" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="4">TWO LENSES ON EMERGENCE</text>
  <path d="M42 68H958" stroke="#18343a" stroke-width="2"/>

  <rect x="42" y="88" width="442" height="188" rx="14" fill="#0b181c" stroke="#24515a"/>
  <rect x="516" y="88" width="442" height="188" rx="14" fill="#151410" stroke="#66502f"/>

  <circle cx="75" cy="122" r="13" fill="none" stroke="#55bac7" stroke-width="2"/>
  <text x="75" y="127" text-anchor="middle" fill="#92d9df" font-family="Arial, Helvetica, sans-serif" font-size="12">1</text>
  <text x="101" y="128" fill="#bce8eb" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="2">MULTISCALE</text>
  <text x="70" y="174" fill="#eef4f3" font-family="Arial, Helvetica, sans-serif" font-size="19">Which coarse-grained variables</text>
  <text x="70" y="200" fill="#eef4f3" font-family="Arial, Helvetica, sans-serif" font-size="19">emerge from high-dimensional dynamics?</text>
  <path d="M70 232H456" stroke="#24515a"/>
  <text x="70" y="256" fill="#65b7c2" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.3">SIGNALS  →  MACROSCOPIC DYNAMICS</text>

  <circle cx="549" cy="122" r="13" fill="none" stroke="#d6a65e" stroke-width="2"/>
  <text x="549" y="127" text-anchor="middle" fill="#f4cf93" font-family="Arial, Helvetica, sans-serif" font-size="12">2</text>
  <text x="575" y="128" fill="#f1d5a7" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="2">SYNERGY</text>
  <text x="544" y="174" fill="#f3f0e8" font-family="Arial, Helvetica, sans-serif" font-size="19">What information do wholes carry</text>
  <text x="544" y="200" fill="#f3f0e8" font-family="Arial, Helvetica, sans-serif" font-size="19">that their parts alone do not?</text>
  <path d="M544 232H930" stroke="#66502f"/>
  <text x="544" y="256" fill="#d6a65e" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.3">PARTS  →  JOINT INFORMATION</text>
</svg>
